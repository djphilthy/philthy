    audio {

        pointer-events: none;
    }

    .track-wrapper {

        text-align: left;
        outline: none;
    }
    .play-btn:hover {
        text-decoration: underline;
    }

        flex-grow: 1;
        height: 12px;
        background: #000; 
        position: relative;
        border-bottom: 1px dashed #555;
    }

        height: 100%;
        background: #fff;
        width: 0%;
        border-right: 2px solid #fff; 
    }

    .time-display {
        font-size: 14px;
        min-width: 50px;
        text-align: right;
    }
